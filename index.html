<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
 <style>

    .loader{
        position: relative;
        width:120px;
        height:120px;
    }
 
 
 
.firstring{
    width:100px;
    height:100px;
    border:10px solid;
    border-radius:60%;
    animation: rotate 2s linear infinite;
   }

   .firstring{
    border-color:transparent blue transparent blue
    
   }
   .secondrind{
    border-color: skyblue transparent skyblue transparent
    animation-direction  
   }

   @keyframes rotate{
    from{
        transform: rotate(0deg);
    }
    to{
        transform: rotate(360deg);
    }
   }

   .bar{
    width:8px;
    height:40px;
    background-color: cyan;
    animation: wave 2s ease-in-out infinite;
    animation-delay: 0.1s;
   }

   .bar:nth-child(2) {
    animation-delay: 0.1s;
}

.bar:nth-child(3) {
    animation-delay: 0.2s;
}

.bar:nth-child(4) {
    animation-delay: 0.3s;
}

.bar:nth-child(5) {
    animation-delay: 0.4s;
}


@keyframes wave {
    0%{
        height:20px;
    }
    50%{
        height:60px;
    }
    100%{
        height:20px;
    }
  
}

  .wave{
    display:flex;
    flex-direction: row;
    gap: 2px;
    border-radius: 10px;
   }

 </style>

<body>
    <div class="loader">
    <div class="firstring"></div>
    <div class="secondring"></div>
    </div>

    <div class="wave">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
</div>


</body>
</html>
